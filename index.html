<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interfaces by De Xin</title>
    <meta
      name="description"
      content="Tan De Xin — front-end developer in Malaysia. Responsive, scalable product interfaces in Vue, React and TypeScript."
    />
    <meta name="author" content="Tan De Xin" />
    <meta name="theme-color" content="#E7E9EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interfaces by De Xin" />
    <meta
      property="og:description"
      content="Front-end developer building the screens people keep open all day."
    />

    <link rel="icon" href="/eyeIcon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@300;400;500&family=Newsreader:opsz,wght@6..72,200..700&display=swap"
    />

    <script>
      /* Applies the stored theme before first paint so there is no flash of the
         wrong palette. No stored choice means the OS preference wins. */
      (function () {
        try {
          var saved = localStorage.getItem("dexin-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (err) {
          /* private mode / blocked storage — fall through to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
